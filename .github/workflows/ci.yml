name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r integrations/server/host/requirements.txt pytest
      - name: Install Zotero test tooling
        run: npm --prefix integrations/zotero/plugin ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - name: Build the complete Zotero plugin
        run: |
          cd integrations/zotero/plugin
          npm test
          npm run build
      - name: Package the complete release
        run: ./scripts/package.sh --xpi "$(find integrations/zotero/plugin/build -name '*.xpi' -print -quit)"
      - name: Reject obvious secrets and personal paths
        run: |
          ! grep -RlE 'sk-[A-Za-z0-9_-]{16,}|/Users/[^/]+/' --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.scaffold --exclude-dir=build --exclude-dir=.pytest_cache --exclude-dir=__pycache__ --exclude=ci.yml .

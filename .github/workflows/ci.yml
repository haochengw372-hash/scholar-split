name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: npm test
      - run: npm run check
      - name: Reject obvious secrets and personal paths
        run: |
          ! grep -RInE 'sk-[A-Za-z0-9_-]{16,}|/Users/[^/]+/' --exclude-dir=.git --exclude=ci.yml .
